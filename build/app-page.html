<title>Hey Armay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: desk-style shell, fixed side rail (date, clock, grouped sections) + working surface; on phones the rail folds into a top band with scrolling tabs */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --field:#F7F9F6; --ink:#16201B; --muted:#5B6A62; --line:#DBE3DC;
  --accent:#1D6B4D; --accent-soft:#DDEFE4; --on-accent:#FFFFFF;
  --sun:#B57E0C; --sun-soft:#FBF0D3; --sky:#2B679E; --sky-soft:#DFEAF5; --rose:#BE3F37; --rose-soft:#F8E2DF;
  --plum:#7A4C93; --plum-soft:#EFE5F4;
  --shadow:0 10px 30px rgba(22,32,27,.12);
  --f-display:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --field:#121A16; --ink:#E5EDE8; --muted:#92A199; --line:#25312A;
  --accent:#5CC497; --accent-soft:#1B3A2C; --on-accent:#0B1A13;
  --sun:#EDBA4A; --sun-soft:#382D13; --sky:#7DB3E6; --sky-soft:#1A2B3C; --rose:#EE7B70; --rose-soft:#3D1F1C;
  --plum:#C49BDB; --plum-soft:#2E2236;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --field:#121A16; --ink:#E5EDE8; --muted:#92A199; --line:#25312A;
  --accent:#5CC497; --accent-soft:#1B3A2C; --on-accent:#0B1A13;
  --sun:#EDBA4A; --sun-soft:#382D13; --sky:#7DB3E6; --sky-soft:#1A2B3C; --rose:#EE7B70; --rose-soft:#3D1F1C;
  --plum:#C49BDB; --plum-soft:#2E2236;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;
  position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.dateblock .day{font-family:var(--f-display);font-size:2.4rem;font-weight:600;line-height:1}
.dateblock .dl{font-weight:600;margin-top:6px}
.dateblock .hj{color:var(--muted);font-size:.82rem}
.dateblock .clock{font-family:var(--f-mono);font-size:.9rem;color:var(--accent);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;flex:1;margin-inline:-6px;padding-inline:6px}
.nav .g{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 10px 3px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--field)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.nav .n.hot{color:var(--rose)}
.nav a.on .n{color:var(--accent)}
.status{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.status b{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok b{background:var(--accent)} .status.bad b{background:var(--rose)}

main{padding-block:22px 48px;padding-left:28px;padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;display:flex;flex-direction:column;gap:22px}

.capture{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.capture input{flex:1;min-width:0;border:0;background:transparent;padding:10px 10px;outline:none}
.capture select{border:0;background:var(--field);border-radius:8px;padding:0 8px;max-width:9.5rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:-14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--rose)} .btn.danger.arm{background:var(--rose);color:var(--surface);border-color:var(--rose)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:.82rem}

input.f,select.f,textarea.f{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea.f{resize:vertical;line-height:1.55}
label.lb{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline > input.f{flex:1 1 180px;width:auto}
.inline > .w-auto{flex:0 0 auto;width:auto}
.inline > .w-num{flex:0 1 8.5rem;width:auto}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.grid.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
form.panel{padding-bottom:12px}
.addrow{display:flex;flex-direction:column;gap:8px;padding:8px 0 8px;border-top:1px solid var(--line)}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:first-child{border-top:0}
.row:hover{background:var(--field)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted);align-items:center}
.row .time{font-family:var(--f-mono);font-size:.82rem;min-width:4.6rem;color:var(--muted);padding-top:2px}
.row .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap;padding-top:1px}
.row .ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chk{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;margin-top:1px;padding:0;position:relative}
.chk.sun{border-color:var(--sun)} .chk.sky{border-color:var(--sky)} .chk.plum{border-color:var(--plum)}
.chk.on{background:var(--accent)} .chk.sun.on{background:var(--sun)} .chk.sky.on{background:var(--sky)} .chk.plum.on{background:var(--plum)}
.chk.on::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--field);color:var(--muted);white-space:nowrap}
.chip.task{background:var(--accent-soft);color:var(--accent)}
.chip.rem{background:var(--sun-soft);color:var(--sun)}
.chip.ev{background:var(--sky-soft);color:var(--sky)}
.chip.late{background:var(--rose-soft);color:var(--rose)}
.chip.plum{background:var(--plum-soft);color:var(--plum)}
.chip.ex{background:transparent;border:1px dashed var(--line)}
.pri-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);display:inline-block}
.empty{color:var(--muted);font-size:.9rem;padding:10px 6px 14px}
.kbar{width:3px;align-self:stretch;border-radius:3px;flex:0 0 auto}
.kbar.ev{background:var(--sky)} .kbar.rem{background:var(--sun)} .kbar.task{background:var(--accent)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;font-weight:500}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.summary{background:var(--accent-soft);border-radius:12px;padding:14px 16px;white-space:pre-wrap;line-height:1.6}
.summary.idle{background:transparent;border:1px dashed var(--line);color:var(--muted);white-space:normal}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sun-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.9rem}
.note-c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.note-c:hover{border-color:var(--muted)}
.note-c .b{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.note-c .nt{font-weight:600;overflow-wrap:anywhere}
.note-c .ft{font-size:.75rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.notes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}

.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:.78rem;color:var(--muted)}

.hchips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
.hchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.hchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;max-width:340px}
.strip i{aspect-ratio:1;border-radius:4px;background:var(--field);border:1px solid var(--line);max-width:100%}
.strip i.on{background:var(--accent);border-color:var(--accent)}
.strip i.td{outline:2px solid var(--sun);outline-offset:1px}
.bar{height:8px;border-radius:999px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.warn{background:var(--sun)} .bar i.over{background:var(--rose)}
.dchart{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.dchart button{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;background:transparent;border:0;padding:0;cursor:pointer}
.dchart button[disabled]{cursor:default}
.dchart button i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.dchart button.td i{background:var(--sun)}
.dchart button:hover i,.dchart button:focus-visible i,.dchart button.on i{outline:2px solid var(--ink);outline-offset:1px}
.daxis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);padding-bottom:6px}
.cats{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.catr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 6px;border-radius:6px;cursor:pointer;border:0;background:transparent;text-align:left;font:inherit;color:var(--ink);width:100%}
.catr:hover{background:var(--field)} .catr.on{background:var(--accent-soft)}
.catr .bar,.catr .cm{grid-column:1/-1}
.catr .cm{font-size:.75rem;color:var(--muted)}
.amtin{font-family:var(--f-mono);font-size:1.15rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--ink);color:var(--surface)}
.dayhead{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:14px 6px 4px;display:flex;justify-content:space-between;gap:8px}
.dayhead:first-child{padding-top:2px}
.dayhead + .row{border-top:0}
.sheet.wide{width:min(760px,100%)}
.vch{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:16px;font-size:.9rem}
.vch .vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
.vch .org{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.vch .doc{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);text-align:right}
.vch .ref{font-family:var(--f-mono);font-size:1rem;text-align:right}
.vch dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 18px;margin:0}
.vch dt{color:var(--muted);font-size:.8rem}
.vch dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.vch .tw{overflow-x:auto}
.vch table{width:100%;border-collapse:collapse;font-size:.86rem}
.vch th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 4px}
.vch td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.vch .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.vch tfoot td{border-bottom:0;padding-top:4px;padding-bottom:4px}
.vch tr.tot td{border-top:2px solid var(--ink);font-weight:700;padding-top:8px}
.vch .words{font-style:italic;font-size:.86rem}
.vch .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:26px}
.vch .sig div{border-top:1px solid var(--ink);padding-top:4px;font-size:.75rem;color:var(--muted)}
.vch .att h4{margin:0 0 6px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.vch .att img{max-height:360px;max-width:100%;border:1px solid var(--line);border-radius:4px;display:block}
.vch .fn{font-size:.72rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.attach{display:inline-flex;align-items:center;gap:4px}
.attach button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
input[type=range]{accent-color:var(--accent);width:100%}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.tile{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile a{color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.tile a:hover{color:var(--accent)}
.tile .u{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere;font-family:var(--f-mono)}

.cklist{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:10px;align-items:center;padding:5px 4px;border-radius:6px}
.ck:hover{background:var(--field)}
.ck span{flex:1;min-width:0;overflow-wrap:anywhere}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.ck .x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 6px;font-size:1rem}
.ckg{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 4px 2px}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal .wk,.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wk div{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;font-weight:600}
.cal .d{min-height:84px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--surface);text-align:left;font:inherit;min-width:0;color:var(--ink)}
.cal .d:nth-child(7n+1){border-left:0}
.cal .d.out{background:var(--field);color:var(--muted)}
.cal .d .dn{font-family:var(--f-mono);font-size:.8rem}
.cal .d.today .dn{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px;align-self:flex-start}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d .ev{font-size:.72rem;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal .d .ev.e{background:var(--sky-soft);color:var(--sky)}
.cal .d .ev.r{background:var(--sun-soft);color:var(--sun)}
.cal .d .ev.t{background:var(--accent-soft);color:var(--accent)}
.cal .d .ev.p{background:var(--plum-soft);color:var(--plum)}
.cal .d .more{font-size:.7rem;color:var(--muted)}
.cal .dots{display:none;gap:3px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .d .ev.a{background:var(--org-soft,#FDE8DA);color:var(--org,#C2410C)}
.cal .dots i.a{background:var(--org,#C2410C)}
.kbar.team{background:var(--org,#C2410C)}
.chip.org{background:var(--org-soft,#FDE8DA);color:var(--org,#C2410C)}
a.row{color:inherit;text-decoration:none}
.tm-chs{display:flex;flex-wrap:wrap;gap:6px}
.cal .dots i.e{background:var(--sky)} .cal .dots i.r{background:var(--sun)} .cal .dots i.t{background:var(--accent)} .cal .dots i.p{background:var(--plum)}

.conn{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.conn .ic{width:34px;height:34px;border-radius:8px;background:var(--field);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);flex:0 0 auto}
.conn p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:12px}
.out{min-height:9rem}
.meetres{display:flex;flex-direction:column;gap:4px}
.meetres label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:6px;cursor:pointer}
.meetres label:hover{background:var(--field)}
.meetres input{margin-top:4px;accent-color:var(--accent)}

#modal{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;
  padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden],#toast[hidden]{display:none}
.sheet{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet .fields{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.sheet .fields .full{grid-column:1/-1}

  <main>
    <div class="wrap">
      <form class="capture" id="capture" autocomplete="off">
        <input id="cap-in" placeholder="Type anything… e.g. meet client at SS2 coffee shop tomorrow 3pm" aria-label="Quick capture">
        <button type="button" class="btn" id="cap-voice" data-act="voice" aria-label="Speak and sort" title="Speak & sort"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>

</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');
const BLN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const BLS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const HARI = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HRS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const today = () => ymd(new Date());
const ym = () => today().slice(0,7);
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const addYears = (s,n) => { const d = parseYmd(s); d.setFullYear(d.getFullYear()+n); return ymd(d); };
const daysBetween = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const money = n => 'RM ' + Number(n||0).toLocaleString('ms-MY',{minimumFractionDigits:2, maximumFractionDigits:2});
function fmtD(s){
  if(!isYmd(s)) return '';
  const t = today();
  if(s===t) return 'Today';
  if(s===addDays(t,1)) return 'Tomorrow';
  if(s===addDays(t,-1)) return 'Yesterday';
  const d = parseYmd(s);
  return `${HRS[d.getDay()]}, ${d.getDate()} ${BLS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`;
}
function fmtT(s){
  if(!s) return '';
  const [h,m] = s.split(':').map(Number);
  if(isNaN(h)) return '';
  const p = h<12?'am':'pm';
  return `${h%12===0?12:h%12}:${pad(m||0)} ${p}`;
}
function rel(ms){
  const diff = ms - Date.now(), a = Math.abs(diff)/60000;
  let v;
  if(a<1) return 'now';
  if(a<60) v = `${Math.round(a)} min`;
  else if(a<1440) v = `${Math.round(a/60)} hr`;
  else v = `${Math.round(a/1440)} days`;
  return diff>0 ? `in ${v}` : `${v} ago`;
}
const relDays = n => n===0 ? 'today' : n===1 ? 'tomorrow' : n===-1 ? 'yesterday' : n>0 ? `in ${n} days` : `${-n} days ago`;
const atMs = s => s ? new Date(s).getTime() : NaN;
function hijri(d){
  try { return new Intl.DateTimeFormat('en-GB-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d); }
  catch(e){ return ''; }
}
function nextAnnual(s){
  if(!isYmd(s)) return null;
  const t = today(), [ , m, d] = s.split('-');
  let y = Number(t.slice(0,4));
  let n = `${y}-${m}-${d}`;
  if(n < t) n = `${y+1}-${m}-${d}`;
  return {date:n, in:daysBetween(t,n), years:Number(n.slice(0,4)) - Number(s.slice(0,4))};
}
function quarter(){ const d = new Date(); return `Q${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`; }

/* ---------- state ---------- */
let items = [], exps = [], rec = null;
const SR = window.__standalone ? (window.SpeechRecognition || window.webkitSpeechRecognition || null) : null;
let col = null, expCol = null, sample = null, downloads = null, assets = null, canImg = false, mode = 'loading', lastMethod = '';
const ui = {
  view:'hari-ini', taskFilter:'aktif', ideaTag:'semua', orangTab:'penting', calMonth:null, calSel:today(), noteQ:'',
  msgTo:'', msgPhone:'', msgText:'', msgIntent:'', mail:{to:'',su:'',intent:'',tone:'Friendly',out:''},
  summary:'', summaryBusy:false, msgBusy:false, mailBusy:false,
  meet:{text:'', busy:false, res:null}, review:'', reviewBusy:false,
  exp:{month:ym(), scope:'semua', cat:'', day:'', newScope:'peribadi', scan:false, sum:'', sumBusy:false, pending:null},
  voice:{text:'', busy:false, res:null, summary:'', keep:true, open:false}
};
{ const d = new Date(); ui.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }

const NAV = [
  [null, [['hari-ini','Today'],['tugasan','Tasks'],['kalendar','Calendar'],['team','Team Schedule'],['belanja','Expenses'],['berat','Weight'],['nota','Notes']]],
  ['Work', [['menunggu','Waiting For'],['bayaran','Payments'],['idea','Ideas']]],
  ['Time', [['peringatan','Reminders'],['tarikh','Expiry Dates']]],
  ['Life', [['bil','Bills'],['matlamat','Goals & Habits'],['perjalanan','Trips']]],
  ['People', [['orang','People'],['mesej','Messages'],['emel','Email']]],
  ['Saved', [['pautan','Links'],['semakan','Weekly Review']]]
];

/* ---------- item schema (drives the editor) ---------- */
const PRI = [['biasa','Normal'],['tinggi','High']];
const REP = [['tiada','Once'],['harian','Every day'],['mingguan','Every week']];
const IDEA_TAG = [['video','Video idea'],['klien','Target client'],['pakej','Package / upsell'],['lain','Other']];
const IDEA_ST = [['baru','New'],['dirancang','Planned'],['dijalankan','In progress'],['siap','Done']];
const REN_CAT = [['kenderaan','Vehicle'],['dokumen','Document'],['domain','Domain & hosting'],['insurans','Insurance'],['langganan','Subscription'],['lain','Other']];
const BILL_CY = [['bulanan','Monthly'],['tahunan','Yearly']];
const GIFT_T = [['hadiah','Gift'],['ziarah','Visit'],['kenduri','Feast / function']];
const LINK_G = [['Sistem','Work systems'],['Laman','Websites'],['Akaun','Accounts & portals'],['Lain','Other']];
const CON_CAT = [['umum','General'],['servis','Service']];
const EXP_CAT = [['makan','Food & drinks'],['transport','Fuel & transport'],['dapur','Groceries & home'],['bil','Bills & subscriptions'],['keluarga','Family'],['kesihatan','Health'],['belibelah','Shopping'],['hiburan','Entertainment & leisure'],['perjalanan','Travel'],['sedekah','Charity & zakat'],['kerja','Work & equipment'],['lain','Other']];
const SCOPE = [['peribadi','Personal'],['bisnes','Business']];
const METHOD = [['','Payment method'],['tunai','Cash'],['kad','Card'],['ewallet','e-Wallet'],['transfer','Bank transfer']];
const ORG = 'ARMEDIA';
const S = {
  task:['Task',[['title','Title','text',1],['due','Due date','date'],['priority','Priority','sel',0,PRI],['notes','Notes','area',1]]],
  reminder:['Reminder',[['title','Remind me to','text',1],['at','Time','dt'],['repeat','Repeat','sel',0,REP]]],
  event:['Event',[['title','Title','text',1],['date','Date','date'],['place','Place','text'],['start','Start','time'],['end','End','time'],['notes','Notes','area',1]]],
  note:['Note',[['title','Title','text',1],['body','Content','area',1],['pinned','Pin to Today','check']]],
  waiting:['Waiting for',[['title','Waiting for what','text',1],['who','From whom','text'],['since','Requested on','date'],['expect','Expected by','date'],['notes','Notes','area',1]]],
  payment:['Payment',[['client','Client','text',1],['desc','For','text',1],['amount','Amount (RM)','num'],['phone','Client phone','tel'],['invDate','Invoice date','date'],['due','Due by','date']]],
  idea:['Idea',[['title','Idea','text',1],['tag','Type','sel',0,IDEA_TAG],['status','Status','sel',0,IDEA_ST],['body','Description','area',1]]],
  renewal:['Expiry Date',[['title','Item','text',1],['date','Expiry date','date'],['category','Category','sel',0,REN_CAT],['cost','Cost (RM)','num'],['notes','Notes','area',1]]],
  bill:['Bill',[['title','Bill','text',1],['amount','Amount (RM)','num'],['day','Pay on day','num'],['cycle','Cycle','sel',0,BILL_CY],['month','Month (for yearly, 1-12)','num']]],
  goal:['Goal',[['title','Goal','text',1],['quarter','Period','text'],['progress','Progress (%)','num'],['notes','Next steps','area',1]]],
  habit:['Habit',[['title','Habit','text',1]]],
  trip:['Trip',[['title','Destination','text',1],['start','Depart','date'],['end','Return','date'],['notes','Notes','area',1]]],
  person:['Key Person',[['name','Name','text'],['rel','Relationship','text'],['phone','Phone','tel'],['every','Contact every (days)','num'],['birthday','Birthday','date'],['anniv','Anniversary / key date','date'],['lastContact','Last contacted','date'],['notes','Notes about them','area',1]]],
  gift:['Gifts & Visits',[['title','Item','text',1],['who','For whom','text'],['type','Type','sel',0,GIFT_T],['date','Date','date'],['notes','Notes','area',1]]],
  contact:['Contact',[['name','Name','text'],['phone','Phone','tel'],['cat','Category','sel',0,CON_CAT],['label','Label / service type','text'],['notes','Notes','area',1]]],
  template:['Template',[['name','Template name','text',1],['body','Message','area',1]]],
  link:['Link',[['title','Name','text',1],['url','Address (https://…)','url',1],['group','Group','sel',0,LINK_G],['notes','Notes (do not store passwords)','area',1]]],
  weight:['Weight',[['kg','Weight (kg)','num'],['date','Date','date'],['note','Note','text',1]]],
  expense:['Expense',[['amount','Amount (RM)','num'],['date','Date','date'],['note','What for','text',1],['cat','Category','sel',0,EXP_CAT],['scope','Type','sel',0,SCOPE],['method','Payment method','sel',0,METHOD]]]
};
const nameOf = i => i.kind==='weight' ? `${Number(i.kg).toFixed(1)} kg` : (i.title || i.name || i.client || i.note || 'Untitled');

/* ---------- storage ---------- */
function toast(msg, action){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  t.hidden = false;
  if(action) t.querySelector('button').onclick = () => { t.hidden = true; action.fn(); };
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, action ? 9000 : 3500);
}
function handleErr(e){
  if(e && e.code==='quota_exceeded') toast('Storage is full. Delete old items first.');
  else toast("Couldn't save right now. Try again shortly.");
}
const colFor = k => k==='expense' ? expCol : col;
async function addItem(data){
  data.created = Date.now();
  if(data.kind==='expense' && !data.docNo && typeof nextDocNo === 'function'){
    data.code = data.code || codeOf(data.cat); data.docNo = nextDocNo(data.scope, data.date || today(), data.code);
    if(data.receiptId && !data.receiptName) data.receiptName = data.docNo + '.jpg';
  }
  const c = colFor(data.kind);
  if(c){
    try { const ref = c.doc(); await ref.set(data); return ref.id; }
    catch(e){ handleErr(e); return null; }
  }
  const id = 'l' + Math.random().toString(36).slice(2);
  (data.kind==='expense' ? exps : items).push({id, ...data}); render(); return id;
}
async function updItem(id, patch){
  const it = get(id), c = colFor(it && it.kind);
  if(c){ try { await c.doc(id).update(patch); } catch(e){ handleErr(e); } return; }
  if(!it) return;
  for(const [k,v] of Object.entries(patch)){
    if(v && typeof v==='object' && !Array.isArray(v) && it[k] && typeof it[k]==='object' && !Array.isArray(it[k])) it[k] = {...it[k], ...v};
    else it[k] = v;
  }
  render();
}
async function delItem(id){
  const it = get(id), c = colFor(it && it.kind);
  if(c){ try { await c.doc(id).delete(); } catch(e){ handleErr(e); } return; }
  items = items.filter(i => i.id!==id); exps = exps.filter(i => i.id!==id); render();
}
const byKind = k => items.filter(i => i.kind===k);
const get = id => items.find(i => i.id===id) || exps.find(i => i.id===id);

/* ---------- derived ---------- */
function waitChase(i){
  if(i.done) return false;
  const t = today();
  if(i.expect) return i.expect <= t;
  return isYmd(i.since) && daysBetween(i.since, t) >= 3;
}
function contactDue(p){
  const n = Number(p.every);
  if(!n) return false;
  if(!isYmd(p.lastContact)) return true;
  return daysBetween(p.lastContact, today()) >= n;
}
function billDueDay(b){
  const d = new Date(), last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return `${ym()}-${pad(Math.min(Math.max(Number(b.day)||1,1), last))}`;
}
const billThisMonth = b => b.cycle!=='tahunan' || Number(b.month)===new Date().getMonth()+1;
const billPaid = b => !!(b.paid && b.paid[ym()]);
function personDates(){
  const out = [];
  for(const p of byKind('person')){
    const b = nextAnnual(p.birthday); if(b) out.push({p, what:'Birthday', ...b});
    const a = nextAnnual(p.anniv); if(a) out.push({p, what:'Anniversary', ...a});
  }
  return out.sort((x,y) => x.in - y.in);
}

/* ---------- side rail ---------- */
function counts(){
  const t = today(), now = Date.now();
  return {
    'tugasan': [byKind('task').filter(i => !i.done).length, byKind('task').some(i => !i.done && i.due && i.due < t)],
    'menunggu': [byKind('waiting').filter(waitChase).length, true],
    'bayaran': [byKind('payment').filter(i => !i.paid).length, byKind('payment').some(i => !i.paid && i.due && i.due < t)],
    'peringatan': [byKind('reminder').filter(i => !i.done && atMs(i.at) <= now).length, true],
    'kalendar': [byKind('event').filter(i => i.date===t).length, false],
    'tarikh': [byKind('renewal').filter(i => isYmd(i.date) && daysBetween(t,i.date) <= 30).length, byKind('renewal').some(i => isYmd(i.date) && daysBetween(t,i.date) <= 7)],
    'bil': [byKind('bill').filter(b => billThisMonth(b) && !billPaid(b) && billDueDay(b) <= addDays(t,3)).length, true],
    'orang': [byKind('person').filter(contactDue).length + personDates().filter(x => x.in <= 7).length, false],
    'nota': [byKind('note').length, false],
    'team': [teamShoots(t).length, teamLate().length > 0]
  };
}
function renderSide(){
  const d = new Date();
  $('#dateblock').innerHTML = `<div class="day">${d.getDate()}</div>
    <div class="dl">${HARI[d.getDay()]}, ${BLN[d.getMonth()]} ${d.getFullYear()}</div>
    <div class="hj">${esc(hijri(d))}</div>
    <div class="clock">${pad(d.getHours())}:${pad(d.getMinutes())}</div>`;
  const c = counts();
  const link = ([k,l]) => { const [n, hot] = c[k] || [0,false];
    return `<a href="#${k}" data-view="${k}" class="${ui.view===k?'on':''}">${l}${n?`<span class="n ${hot?'hot':''}">${n}</span>`:''}</a>`; };
  const group = ([g, list]) => (g?`<div class="g">${g}</div>`:'') + list.map(link).join('');
  const rest = NAV.slice(1), inRest = rest.some(([, l]) => l.some(([k]) => k===ui.view));
  const open = ui.navMore || inRest;
  const restHot = rest.some(([, l]) => l.some(([k]) => (c[k]||[])[0] && (c[k]||[])[1]));
  $('#nav').innerHTML = group(NAV[0]) + `<button type="button" class="nav-more ${open?'open':''}" data-navmore aria-expanded="${open}"><span>More sections</span>${restHot&&!open?'<i class="dot"></i>':''}<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>`
    + `<div class="nav-rest" ${open?'':'hidden'}>${rest.map(group).join('')}</div>`;
  const st = $('#status');
  st.className = 'status ' + (mode==='db'?'ok':mode==='loading'?'':'bad');
  st.querySelector('span').textContent = mode==='db' ? (window.__standalone ? 'Saved on heyarmay.com' : 'Saved to your account') : mode==='loading' ? 'Connecting…' : 'Not saved in this view';
}

/* ---------- row builders ---------- */
const exChip = i => i.example ? '<span class="chip ex">sample</span>' : '';
const empty = s => `<div class="empty">${s}</div>`;
function dueChip(due){
  if(!isYmd(due)) return '';
  const t = today();
  const cls = due < t ? 'late' : due===t ? 'rem' : '';
  return `<span class="chip ${cls}">${due<t?'Overdue · ':''}${esc(fmtD(due))}</span>`;
}
function rowTask(i){
  return `<div class="row ${i.done?'done':''}" data-open="${i.id}">
    <button class="chk ${i.done?'on':''}" data-toggle="${i.id}" aria-label="${i.done?'Mark as not done':'Mark as done'}"></button>
    <div class="rt"><span class="t">${i.priority==='tinggi'?'<span class="pri-dot" title="High priority"></span> ':''}${esc(i.title)}</span>
    <span class="meta">${dueChip(i.done?null:i.due)}${i.notes?'<span>has notes</span>':''}${exChip(i)}</span></div></div>`;
}
function rowRem(i){
  const ms = atMs(i.at), late = !i.done && ms <= Date.now();
  const d = (i.at||'').slice(0,10), tm = (i.at||'').slice(11,16);
  return `<div class="row ${i.done?'done':''}" data-open="${i.id}">
    <button class="chk sun ${i.done?'on':''}" data-toggle="${i.id}" aria-label="Mark as done"></button>
    <div class="rt"><span class="t">${esc(i.title)}</span>
    <span class="meta"><span class="chip ${late?'late':'rem'}">${esc(fmtD(d))} · ${esc(fmtT(tm))}</span>
    ${!i.done && !isNaN(ms) ? `<span>${rel(ms)}</span>`:''}${i.repeat && i.repeat!=='tiada' ? `<span>repeats ${esc(i.repeat==='harian'?'daily':i.repeat==='mingguan'?'weekly':i.repeat)}</span>`:''}${exChip(i)}</span></div></div>`;
}
function rowEv(i, showDate){
  return `<div class="row" data-open="${i.id}">
    <span class="kbar ev"></span>
    <span class="time">${i.start?esc(fmtT(i.start)):'All day'}</span>
    <div class="rt"><span class="t">${esc(i.title)}</span>
    <span class="meta">${showDate?`<span class="chip ev">${esc(fmtD(i.date))}</span>`:''}${i.end?`<span>until ${esc(fmtT(i.end))}</span>`:''}${i.place?`<span>${esc(i.place)}</span>`:''}${exChip(i)}</span></div></div>`;
}
function rowWait(i){
  const t = today(), chase = waitChase(i);

async function pushOn(){
  if(!pushOk()){ toast("This browser can't receive notifications."); return; }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ ui.push = perm === 'denied' ? 'denied' : 'off'; render(); toast(perm === 'denied' ? 'Notifications are blocked. Allow them for heyarmay.com in your browser settings.' : 'Notifications were not allowed.'); return; }
    const {key} = await (await fetch('/api/push/key', {cache:'no-store'})).json();
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: u8(key)});
    const r = await fetch('/api/push/sub', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(sub)});
    if(!r.ok) throw new Error('sub');
    ui.push = 'on'; render();
    toast("Done. You'll get today's plan at 8:00 am every morning. Sending a preview now.");
    fetch('/api/push/test', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({endpoint: sub.endpoint})}).catch(() => {});
  } catch(e){ toast("Couldn't turn on notifications. Try again."); }
}

async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    return b || file;
  } catch(e){ return file; }
}
async function rotateBlob(blob, deg){
  const bmp = await createImageBitmap(blob), c = document.createElement('canvas'), q = deg % 180 !== 0;
  c.width = q ? bmp.height : bmp.width; c.height = q ? bmp.width : bmp.height;
  const g = c.getContext('2d'); g.translate(c.width/2, c.height/2); g.rotate(deg * Math.PI / 180); g.drawImage(bmp, -bmp.width/2, -bmp.height/2);
  return await new Promise(res => c.toBlob(b => res(b || blob), 'image/jpeg', 0.88));
}

const fix2 = n => (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2, maximumFractionDigits:2});
function longDate(s){ if(!isYmd(s)) return '-'; const d = parseYmd(s); return `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; }
function bmWords(n){
  const s = ['','satu','dua','tiga','empat','lima','enam','tujuh','lapan','sembilan'];
  const u = x => { const o = [], h = Math.floor(x/100), r = x%100;
    if(h) o.push(h===1 ? 'seratus' : s[h]+' ratus');
    if(r){ if(r<10) o.push(s[r]); else if(r===10) o.push('sepuluh'); else if(r===11) o.push('sebelas'); else if(r<20) o.push(s[r-10]+' belas'); else { o.push(s[Math.floor(r/10)]+' puluh'); if(r%10) o.push(s[r%10]); } }
    return o.join(' '); };
  if(!n) return 'kosong';
  const p = [], jt = Math.floor(n/1e6), rb = Math.floor(n%1e6/1000), rest = n%1000;
  if(jt) p.push(u(jt)+' juta'); if(rb) p.push(rb===1 ? 'seribu' : u(rb)+' ribu'); if(rest) p.push(u(rest));
  return p.join(' ');
}
function enWords(n){
  const a = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const u = x => { const o = [], h = Math.floor(x/100), r = x%100;
    if(h) o.push(a[h]+' hundred');
    if(r){ if(h) o.push('and'); if(r<20) o.push(a[r]); else o.push(tens[Math.floor(r/10)] + (r%10 ? '-' + a[r%10] : '')); }
    return o.join(' '); };
  if(!n) return 'zero';
  const p = [], m = Math.floor(n/1e6), th = Math.floor(n%1e6/1000), rest = n%1000;
  if(m) p.push(u(m)+' million'); if(th) p.push(u(th)+' thousand'); if(rest) p.push(u(rest));
  return p.join(' ');
}
function rmWords(a){
  a = Math.round((Number(a)||0)*100)/100;
  const r = Math.floor(a), sen = Math.round((a-r)*100);
  const w = 'Ringgit Malaysia ' + enWords(r) + (sen ? ' and sen ' + enWords(sen) : '') + ' only';
  return w.replace(/\b\p{L}/gu, c => c.toUpperCase());
}

let jsPdfP = null;
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(!jsPdfP) jsPdfP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => window.jspdf && window.jspdf.jsPDF ? res(window.jspdf.jsPDF) : rej(new Error('jspdf'));

function weightStats(list){
  const w = list.slice().sort((a,b) => a.date.localeCompare(b.date));
  if(!w.length) return null;
  const last = w[w.length-1], first = w[0];
  const near = days => { const target = addDays(last.date, -days); let best = null; for(const x of w){ if(x.date <= target) best = x; } return best; };
  const d7 = near(7), d30 = near(30);
  const span = daysBetween(first.date, last.date);
  // kadar purata seminggu: kecerunan regresi linear 30 hari terakhir (atau semua jika kurang)
  const win = w.filter(x => daysBetween(x.date, last.date) <= 30);
  let perWeek = null;
  if(win.length >= 3){
    const xs = win.map(x => daysBetween(win[0].date, x.date)), ys = win.map(x => Number(x.kg));
    const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
    const num = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0), den = xs.reduce((s,x)=>s+(x-mx)*(x-mx),0);
    if(den > 0) perWeek = num/den*7;
  }
  const kgs = w.map(x => Number(x.kg));
  return {w, last, first, span, d7: d7 ? last.kg - d7.kg : null, d30: d30 ? last.kg - d30.kg : null, total: last.kg - first.kg, perWeek,
    min: w.reduce((a,b) => b.kg < a.kg ? b : a), max: w.reduce((a,b) => b.kg > a.kg ? b : a), avg: kgs.reduce((a,b)=>a+b,0)/kgs.length};
}
const sdW = s => { const d = parseYmd(s); return `${d.getDate()} ${BLS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+String(d.getFullYear()).slice(2):''}`; };
const sgn = (n, u = ' kg') => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(1) + u;
function weightChart(w){
  const R = ui.wRange || '90';
  const end = today(), start = R === 'all' ? (w[0] ? w[0].date : end) : addDays(end, -Number(R));
  const pts = w.filter(x => x.date >= start);
  if(pts.length < 2) return `<div class="empty">${pts.length ? 'One entry in this period. Add more to see the chart.' : 'No entries in this period.'}</div>`;
  const vw = (document.getElementById('view') || {}).clientWidth || 640;
  const W = Math.round(Math.max(300, Math.min(900, vw - 44))), H = W < 520 ? 200 : 240, L = 40, Rr = 14, T = 14, B = 26;
  const t0 = parseYmd(start).getTime(), t1 = parseYmd(end).getTime(), span = Math.max(1, t1 - t0);
  const ks = pts.map(x => Number(x.kg)); let lo = Math.min(...ks), hi = Math.max(...ks);
  const pad = Math.max(0.5, (hi - lo) * 0.15); lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2;
  const X = d => L + (parseYmd(d).getTime() - t0) / span * (W - L - Rr), Y = k => T + (hi - k) / (hi - lo) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const line = pts.map((x, i) => `${i ? 'L' : 'M'}${X(x.date).toFixed(1)} ${Y(x.kg).toFixed(1)}`).join(' ');
  const area = line + ` L${X(pts[pts.length-1].date).toFixed(1)} ${H - B} L${X(pts[0].date).toFixed(1)} ${H - B} Z`;
  const lastP = pts[pts.length-1];
  const dots = pts.length <= 60 ? pts.map(x => `<circle class="wdot" cx="${X(x.date).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="4"/>`).join('') : '';
  const mid = addDays(start, Math.round(daysBetween(start, end) / 2));
  return `<div class="wchart" data-pts='${esc(JSON.stringify(pts.map(x => [x.date, x.kg, X(x.date), Y(x.kg)])))}' data-w="${W}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart, ${pts.length} entries, ${fmtD(pts[0].date)} to ${fmtD(lastP.date)}">
      <defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      ${ticks.map(k => `<line class="wgrid" x1="${L}" x2="${W - Rr}" y1="${Y(k).toFixed(1)}" y2="${Y(k).toFixed(1)}"/><text class="wtick" x="${L - 6}" y="${(Y(k) + 4).toFixed(1)}" text-anchor="end">${k.toFixed(1)}</text>`).join('')}
      <text class="wtick" x="${L}" y="${H - 6}">${esc(sdW(start))}</text><text class="wtick" x="${X(mid).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(sdW(mid))}</text><text class="wtick" x="${W - Rr}" y="${H - 6}" text-anchor="end">${esc(sdW(end))}</text>
      <path class="warea" d="${area}" fill="url(#wfill)"/>
      <path class="wline" d="${line}"/>
      ${dots}
      <circle class="wlast" cx="${X(lastP.date).toFixed(1)}" cy="${Y(lastP.kg).toFixed(1)}" r="6"/>
      <g class="wcross" visibility="hidden"><line class="wx" y1="${T}" y2="${H - B}"/><circle class="wpt" r="6"/></g>
    </svg><div class="wtip" hidden></div></div>`;
}

  tip.innerHTML = `<b>${Number(best[1]).toFixed(1)} kg</b><span>${esc(fmtD(best[0]))}</span>`;

function habitStrip(h){
  const t = today(); let cells = '', streak = 0;
  for(let k=13;k>=0;k--){ const s = addDays(t,-k); cells += `<i class="${h.log&&h.log[s]?'on':''} ${k===0?'td':''}" title="${esc(fmtD(s))}"></i>`; }
  for(let k=(h.log&&h.log[t])?0:1;;k++){ if(h.log && h.log[addDays(t,-k)]) streak++; else break; }
  return {cells, streak};
}

function weekData(){
  const t = today(), from = addDays(t,-6), to = addDays(t,7);
  const inLast = ms => ms && ymd(new Date(ms)) >= from;
  const doneT = byKind('task').filter(i => i.done && inLast(i.doneAt));
  const openT = byKind('task').filter(i => !i.done);
  const lateT = openT.filter(i => i.due && i.due < t);
  const recv = byKind('waiting').filter(i => i.done && inLast(i.doneAt));
  const chase = byKind('waiting').filter(waitChase);
  const paid = byKind('payment').filter(i => i.paid && inLast(i.paidAt));
  const owed = byKind('payment').filter(i => !i.paid);
  const habits = byKind('habit').map(h => { let n=0; for(let k=0;k<7;k++) if(h.log && h.log[addDays(t,-k)]) n++; return {title:h.title, n}; });
  const evNext = byKind('event').filter(i => i.date > t && i.date <= to).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
  const dueNext = openT.filter(i => i.due && i.due >= t && i.due <= to);
  const renNext = byKind('renewal').filter(i => isYmd(i.date) && i.date <= addDays(t,30));
  const pdNext = personDates().filter(x => x.in <= 7);
  const goals = byKind('goal');
  const ideas = byKind('idea').filter(i => inLast(i.created));
  const spent = exps.filter(e => e.date >= from && e.date <= t);
  return {doneT, openT, lateT, recv, chase, paid, owed, habits, evNext, dueNext, renNext, pdNext, goals, ideas, spent};
}

/* ---------- toggles ---------- */
async function toggle(id){
  const i = get(id); if(!i) return;
  if(i.kind==='reminder' && !i.done && i.repeat && i.repeat!=='tiada'){
    const step = i.repeat==='harian' ? 1 : 7;
    let d = new Date(i.at);
    do { d.setDate(d.getDate()+step); } while(d.getTime() <= Date.now());
    const at = `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    await updItem(id, {at});
    toast(`Next: ${fmtD(ymd(d))}, ${fmtT(at.slice(11))}`);
    return;
  }
  if(i.kind==='payment'){
    const paid = !i.paid;
    await updItem(id, {paid, paidAt: paid ? Date.now() : null});
    if(paid) toast(`${i.client} marked as paid`, {label:'Undo', fn:() => updItem(id, {paid:false, paidAt:null})});
    return;
  }
  const done = !i.done;
  await updItem(id, {done, doneAt: done ? Date.now() : null});
  if(done) toast(i.kind==='waiting' ? 'Marked as received' : 'Marked as done', {label:'Undo', fn:() => updItem(id, {done:false, doneAt:null})});
}

function gcalLink(i){

async function saveEditor(){

  const p = {};
  for(const [k,,type] of S[i.kind][1]){
    const el = document.getElementById('e-'+k); if(!el) continue;

function dayLines(){
  const t = today(), now = Date.now(), L = [];
  byKind('event').filter(i => i.date===t).sort(byStart).forEach(i => L.push(`Event ${i.start||'all day'}: ${i.title}${i.place?' @ '+i.place:''}`));
  byKind('reminder').filter(i => !i.done && (i.at||'').slice(0,10)<=t).forEach(i => L.push(`Reminder ${String(i.at).replace('T',' ')}${atMs(i.at)<now?' (already passed)':''}: ${i.title}`));
  byKind('task').filter(i => !i.done).sort(byDue).slice(0,20).forEach(i => L.push(`Task${i.priority==='tinggi'?' [important]':''}${i.due?' due '+i.due+(i.due<t?' (OVERDUE)':''):''}: ${i.title}`));
  byKind('waiting').filter(waitChase).forEach(i => L.push(`Chase ${i.who||'someone'}: ${i.title} (requested ${i.since||'?'})`));
  byKind('payment').filter(i => !i.paid && i.due && i.due<=addDays(t,3)).forEach(i => L.push(`Client payment ${i.client} ${money(i.amount)} ${i.due<t?'OVERDUE since':'due'} ${i.due}`));
  byKind('bill').filter(b => billThisMonth(b) && !billPaid(b) && billDueDay(b)<=addDays(t,3)).forEach(b => L.push(`Bill ${b.title} ${money(b.amount)} on day ${b.day}`));
  byKind('renewal').filter(i => isYmd(i.date) && daysBetween(t,i.date)<=14).forEach(i => L.push(`${i.title} expires on ${i.date}`));
  personDates().filter(x => x.in<=7).forEach(x => L.push(`${x.what} ${x.p.name} ${relDays(x.in)}`));
  byKind('person').filter(contactDue).slice(0,3).forEach(p => L.push(`Haven't contacted ${p.name} in a while${p.rel?' ('+p.rel+')':''}`));
  byKind('event').filter(i => i.date>t && i.date<=addDays(t,3)).forEach(i => L.push(`Upcoming ${i.date} ${i.start||''}: ${i.title}`));
  const h = byKind('habit').filter(x => !(x.log && x.log[t])).map(x => x.title);
  if(h.length) L.push(`Habits not ticked today: ${h.join(', ')}`);
  return L;
}

  if((el = pick('data-tcal'))){ const n = Number(el.dataset.tcal), m = ui.teamMonth || new Date();
    if(n===0){ const d = new Date(); ui.teamMonth = new Date(d.getFullYear(), d.getMonth(), 1); ui.teamSel = today(); }
    else ui.teamMonth = new Date(m.getFullYear(), m.getMonth()+n, 1);
    render(); loadTeam(); return; }
  if((el = pick('data-wrange'))){ ui.wRange = el.dataset.wrange; render(); return; }
  if((el = pick('data-tday'))){ ui.teamSel = el.dataset.tday; render(); return; }
  if((el = pick('data-cal'))){ const n = Number(el.dataset.cal), m = ui.calMonth;
    if(n===0){ const d = new Date(); ui.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); ui.calSel = today(); }
    else ui.calMonth = new Date(m.getFullYear(), m.getMonth()+n, 1);
    render(); loadTeam(); return; }
  if((el = pick('data-day'))){ ui.calSel = el.dataset.day; render(); return; }
  if(T.matches('[data-meet]')){ const r = ui.meet.res && ui.meet.res[Number(T.dataset.meet)]; if(r) r.on = T.checked; return; }
  if(T.matches('[data-vz]')){ const r = ui.voice.res && ui.voice.res[Number(T.dataset.vz)]; if(r) r.on = T.checked; return; }
  if(T.matches('[data-goal]')) return;
  if((el = pick('data-vch'))){ openVoucher(get(el.dataset.vch)); return; }
  if((el = pick('data-open'))){ openEditor(get(el.dataset.open)); return; }
  if((el = pick('data-tpl'))){ const x = get(el.dataset.tpl); if(x){ ui.msgText = x.body||''; render(); toast('Template loaded'); } return; }
  if(T === $('#modal')){ closeEditor(); return; }
  const act = pick('data-act');
  if(!act) return;
  const k = act.dataset.act;
  if(k==='close') closeEditor();
  if(k==='save') saveEditor();
  if(k==='ed-edit' && editing){ openEditor(get(editing.id) || editing, true); return; }
  if(k==='ed-back' && editing){ const it = get(editing.id); if(it) openEditor(it); else closeEditor(); return; }
  if(k==='ed-toggle'){ const id = editing.id; closeEditor(); toggle(id); }
  if(k==='del'){
    if(!act.classList.contains('arm')){ act.classList.add('arm'); act.textContent = 'Tap again to delete'; setTimeout(()=>{ if(act.isConnected){ act.classList.remove('arm'); act.textContent='Delete'; } }, 4000); return; }
    const id = editing.id, it = get(id); closeEditor(); await delItem(id); toast('Deleted');
    if(it && it.receiptId && assets) assets.delete(it.receiptId).catch(() => {});
  }
  if(k==='summary') summarize();
  if(k==='clear-ex'){
    if(!act.classList.contains('arm')){ act.classList.add('danger','arm'); act.textContent = 'Tap again to confirm'; return; }
    const ex = [...items, ...exps].filter(i => i.example).map(i => i.id);
    for(const id of ex) await delItem(id);
    toast('Sample items deleted');
  }
  if(k==='push-on'){ pushOn(); return; }
  if(k==='push-hide'){ ui.pushHide = true; try { localStorage.setItem('hy-push-hide', '1'); } catch(e){} render(); return; }
  if(k==='cap-as'){ const sel = $('#cap-kind'), inp = $('#cap-in'); if(sel) sel.value = act.dataset.kind;
    if(inp){ inp.placeholder = act.dataset.kind==='expense' ? 'e.g. 12.50 nasi lemak' : 'e.g. send client invoice tomorrow'; }
    if(matchMedia('(max-width: 820px)').matches) document.body.classList.add('hy-cap'); else window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(() => inp && inp.focus(), 120); return; }
  if(k==='new-note'){ const data = {kind:'note', title:'', body:'', pinned:false, updated:Date.now()}; const id = await addItem(data); if(id) openEditor({id, ...data}, true); }
  if(k==='msg-draft') draftMsg();
  if(k==='msg-copy') copyText(ui.msgText);
  if(k==='msg-save-tpl'){
    if(!ui.msgText.trim()){ toast('The message is still empty.'); return; }
    const data = {kind:'template', name:(ui.msgIntent||ui.msgText).slice(0,40), body:ui.msgText};
    const id = await addItem(data); if(id) toast('Template saved', {label:'Name it', fn:()=>openEditor({id, ...data}, true)});
  }
  if(k==='mail-draft') draftMail();
  if(k==='mail-copy') copyText((ui.mail.su?`Subject: ${ui.mail.su}\n\n`:'') + ui.mail.out);
  if(k==='meet-run') meetRun();
  if(k==='meet-add') meetAdd();
  if(k==='meet-clear'){ ui.meet = {text:'', busy:false, res:null}; render(); }
  if(k==='review') writeReview();
  if(k==='bud-open') openBudget();
  if(k==='bud-save') saveBudget();
  if(k==='exp-csv') exportCsv();
  if(k==='exp-pdf'){
    const list = monthExps(ui.exp.month).filter(e => scopeOf(e)==='bisnes').sort((a,b) => String(a.date).localeCompare(String(b.date)) || (a.created||0)-(b.created||0));
    if(!list.length){ toast('No business expenses this month.'); return; }
    savePdf(list, `business-vouchers-${ui.exp.month}.pdf`);
  }
  if(k==='exp-unattach'){ ui.exp.pending = null; render(); }
  if(k==='hud-speak') hudSpeak();
  if(k==='hud-more'){ ui.hudMore = !ui.hudMore; render(); return; }
  if(k==='hud-loc') hudLoc();
  if(k==='voice'){ openVoice('', false); if(SR && !rec) micToggle(); }
  if(k==='vz-mic') micToggle();
  if(k==='vz-unpic') dropPic(act.dataset.ix != null ? Number(act.dataset.ix) : null);
  if(k==='vz-run') vzRun();
  if(k==='vz-add') vzAdd();
  if(k==='vz-clear'){ ui.voice = {...ui.voice, text:'', res:null, summary:''}; renderVoice(); }
  if(k==='voucher'){ const id = editing && editing.id; closeEditor(); openVoucher(get(id)); }
  if(k==='vch-pdf'){ const e = get($('#modal').dataset.vid); if(e) savePdf([e], `${docOf(e)}.pdf`); }
  if(k==='vch-img'){ const e = get($('#modal').dataset.vid); if(e && e.receiptId){ try { const r = await fetch('/_blob/' + e.receiptId); const b = await r.blob(); await saveBlobAs(b, e.receiptName || docOf(e) + '.' + extOf(b.type)); } catch(err){ toast("Couldn't download the receipt."); } } }
  if(k==='rec-rot'){ ui.rec.rot = (ui.rec.rot + 90) % 360; const i = $('#rec-img'); if(i) i.style.transform = `rotate(${ui.rec.rot}deg)`; }
  if(k==='rec-zoom'){ const i = $('#rec-img'); if(i) i.closest('.rec-img').classList.toggle('big'); }
  if(k==='exp-zip') receiptsZip(ui.exp.month);
  if(k==='vch-edit'){ const e = get($('#modal').dataset.vid); closeEditor(); openEditor(e, true); }
  if(k==='exp-sum') expSummary();
  if(k==='exp-clearf'){ ui.exp.cat = ''; ui.exp.day = ''; render(); }
  if(k==='review-save'){ const id = await addItem({kind:'note', title:`Weekly review ${fmtD(today())}`, body:ui.review, pinned:false, updated:Date.now()}); if(id) toast('Review saved as a note'); }
});
document.addEventListener('input', ev => {
  const id = ev.target.id;
  if(id==='note-q'){ ui.noteQ = ev.target.value; render(); }
  if(id==='meet-text') ui.meet.text = ev.target.value;
  if(id==='vz-text') ui.voice.text = ev.target.value;
  if(id==='msg-text' || id==='msg-phone'){
    if(id==='msg-text') ui.msgText = ev.target.value; else { ui.msgPhone = ev.target.value; }
    const w = $('#msg-wa'); if(w) w.href = waLink(); }
  if(id==='msg-intent') ui.msgIntent = ev.target.value;
  if(['ml-to','ml-su','ml-intent','ml-out'].includes(id)){
    ui.mail[{'ml-to':'to','ml-su':'su','ml-intent':'intent','ml-out':'out'}[id]] = ev.target.value;
    const g = $('#ml-gm'), m = ui.mail;
    if(g) g.href = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(m.to)}&su=${encodeURIComponent(m.su)}&body=${encodeURIComponent(m.out)}`;
  }
});
document.addEventListener('change', ev => {
  const T = ev.target;
  if(T.id==='msg-to'){ ui.msgTo = T.value; if(T.value) ui.msgPhone = ''; render(); }
  if(T.id==='ml-tone') ui.mail.tone = T.value;
  if(T.matches('[data-goal]')) updItem(T.dataset.goal, {progress:Number(T.value)});
  if(T.id==='ex-file' && T.files && T.files[0]) scanReceipt(T.files[0]);
  if((T.id==='pic-file' || T.id==='pic-file2') && T.files && T.files.length){ const fs = Array.from(T.files); T.value = ''; openPic(fs); }
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const F = ev.target, f = F.id;
  const v = id => (document.getElementById(id)||{value:''}).value.trim();
  const num = id => { const x = v(id); return x==='' ? null : Number(x); };
  const t = today();
  if(f==='capture'){
    const text = v('cap-in'); if(!text) return;
    const kind = $('#cap-kind').value;
    if(kind==='auto' && sample && (text.length > 140 || (text.match(/[.!?\n]/g) || []).length >= 2)){ $('#cap-in').value = ''; openVoice(text, true); return; }
    if(await capture(text, kind)) $('#cap-in').value = '';
    return;
  }
  if(F.classList.contains('trip-add')){ const tr = get(F.dataset.trip); const x = F.elements.t.value.trim(); if(!tr || !x) return;
    await updItem(tr.id, {list:[...(tr.list||[]), {g:'Other', t:x, done:false}]}); return; }
  const add = async (data, msg) => { F.reset(); if(await addItem(data)) toast(msg); };
  if(f==='f-rec'){
    const amount = num('rec-amt');
    if(!(amount > 0)){ toast('Enter an amount.'); return; }
    const scope = (document.querySelector('input[name=rec-scope]:checked') || {}).value || 'peribadi';
    const date = isYmd(v('rec-date')) ? v('rec-date') : t, cat = v('rec-cat'), code = cleanCode(v('rec-code')), method = v('rec-method');
    const pend = ui.rec && ui.rec.pend;
    const docNo = nextDocNo(scope, date, code);
    const data = {kind:'expense', amount:Math.round(amount*100)/100, note:v('rec-note') || v('rec-payee'), cat, scope, date, method, code, docNo, vno:nextVno(scope, date)};
    if(pend){
      data.receipt = {...(pend.receipt || {}), merchant: v('rec-payee')};
      if(assets){
        const btn = F.querySelector('[type=submit]'); if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
        let blob = pend.blob;
        if(ui.rec.rot){ try { blob = await rotateBlob(blob, ui.rec.rot); } catch(e){} }
        try { const up = await assets.upload(blob, {type: blob.type==='image/png' ? 'image/png' : 'image/jpeg'}); data.receiptId = up.id; data.receiptName = docNo + '.' + extOf(blob.type); }
        catch(e){ toast(e && e.code==='quota_or_state' ? 'Photo storage is full. Saved without the receipt photo.' : "The receipt photo couldn't be saved. The record was still saved."); }
      }
    } else if(v('rec-payee')) data.receipt = {merchant: v('rec-payee')};
    lastMethod = method; try { localStorage.setItem('pd-method', method); } catch(e){}
    closeEditor();
    if(pend && pend.url) URL.revokeObjectURL(pend.url);
    ui.rec = null;
    const nid = await addItem(data);
    if(nid) toast(`Saved · ${docNo}`, {label:'View', fn:() => openVoucher(get(nid) || {id:nid, ...data})});
    render();
    return;
  }
  if(f==='f-exp'){
    const amount = num('ex-amt');
    if(!(amount > 0)){ toast('Enter an amount.'); return; }
    let cat = v('ex-cat'); const note = v('ex-note'), date = v('ex-date') || t, method = v('ex-method'), scope = ui.exp.newScope;
    lastMethod = method; try { localStorage.setItem('pd-method', method); } catch(e){}
    F.reset();
    const a = document.getElementById('ex-amt'); if(a) a.focus();
    const pend = ui.exp.pending; ui.exp.pending = null;
    const data = {kind:'expense', amount:Math.round(amount*100)/100, note, cat, scope, date, method, vno:nextVno(scope, date)};
    if(pend){
      data.receipt = pend.receipt;
      if(assets){
        try { const up = await assets.upload(pend.blob, {type:pend.blob.type==='image/png'?'image/png':'image/jpeg'}); data.receiptId = up.id; }
        catch(e){ toast(e && e.code==='quota_or_state' ? 'Photo storage is full. Saved without the receipt photo.' : "The receipt photo couldn't be saved. The record was still saved."); }
      }
    }
    if(data.cat==='auto') data.cat = await guessCat(note);
    data.code = codeOf(data.cat); data.docNo = nextDocNo(scope, date, data.code);
    if(data.receiptId) data.receiptName = data.docNo + '.jpg';
    const nid = await addItem(data);
    if(nid) toast(`${money(amount)} recorded · ${catName(data.cat)}${scope==='bisnes'?' · business':''}`, {label:'View record', fn:() => openVoucher(get(nid) || {id:nid, ...data})});
    render();
    return;
  }
  if(f==='f-task') await add({kind:'task', title:v('nt-title'), due:v('nt-due')||null, priority:v('nt-pri'), done:false}, 'Task added');
  if(f==='f-rem'){ const at = v('nr-at'); if(!at) return; await add({kind:'reminder', title:v('nr-title'), at, repeat:v('nr-rep'), done:false}, `Reminder ${fmtD(at.slice(0,10))}, ${fmtT(at.slice(11))}`); }
  if(f==='f-weight'){
    const kg = Math.round(num('w-kg') * 10) / 10, date = isYmd(v('w-date')) ? v('w-date') : t;
    if(!(kg > 20 && kg < 400)){ toast('Enter your weight in kg, e.g. 72.5'); return; }
    const same = byKind('weight').find(w => w.date === date);
    if(same){ await updItem(same.id, {kg}); toast(`Weight for ${fmtD(date)} updated: ${kg.toFixed(1)} kg`); }
    else { await addItem({kind:'weight', kg, date, note:''}); toast(`Weight ${kg.toFixed(1)} kg saved`); }
    const el = document.getElementById('w-kg'); if(el) el.value = '';
    return;
  }
  if(f==='f-ev') await add({kind:'event', title:v('ne-title'), date:ui.calSel, start:v('ne-start'), end:v('ne-end'), place:''}, 'Event added');
  if(f==='f-contact') await add({kind:'contact', name:v('nc-name'), phone:v('nc-phone'), label:v('nc-label'), cat:'umum'}, 'Contact added');
  if(f==='f-wait') await add({kind:'waiting', title:v('nw-title'), who:v('nw-who'), since:t, expect:v('nw-exp'), done:false}, 'Added to Waiting For');
  if(f==='f-pay') await add({kind:'payment', client:v('np-client'), desc:v('np-desc'), amount:num('np-amt')||0, phone:v('np-phone'), invDate:t, due:v('np-due'), paid:false}, 'Payment recorded');
  if(f==='f-idea') await add({kind:'idea', title:v('ni-title'), tag:v('ni-tag'), status:'baru', body:''}, 'Idea saved');
  if(f==='f-renew') await add({kind:'renewal', title:v('nn-title'), date:v('nn-date'), category:v('nn-cat'), cost:num('nn-cost')}, 'Expiry date added');
  if(f==='f-bill') await add({kind:'bill', title:v('nb-title'), amount:num('nb-amt')||0, day:num('nb-day')||1, cycle:v('nb-cy'), month:new Date().getMonth()+1, paid:{}}, 'Bill added');
  if(f==='f-goal') await add({kind:'goal', title:v('ng-title'), quarter:quarter(), progress:0, notes:''}, 'Goal added');
  if(f==='f-habit') await add({kind:'habit', title:v('nh-title'), log:{}}, 'Habit added');
  if(f==='f-trip') await add({kind:'trip', title:v('nv-title'), start:v('nv-start'), end:v('nv-end'), list:[]}, 'Trip added');
  if(f==='f-person') await add({kind:'person', name:v('no-name'), rel:v('no-rel'), phone:v('no-phone'), birthday:v('no-bday'), every:num('no-every'), lastContact:t, notes:''}, 'Key person added');
  if(f==='f-gift') await add({kind:'gift', title:v('ng2-title'), who:v('ng2-who'), type:v('ng2-type'), date:v('ng2-date'), done:false}, 'Added');
  if(f==='f-servis') await add({kind:'contact', cat:'servis', label:v('ns-label'), name:v('ns-name'), phone:v('ns-phone'), notes:''}, 'Service contact added');
  if(f==='f-link'){ let u = v('nl-url'); if(u && !/^https?:\/\//i.test(u)) u = 'https://'+u; await add({kind:'link', title:v('nl-title'), url:u, group:v('nl-group'), notes:''}, 'Link added'); }
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && !$('#modal').hidden) closeEditor(); });
const showDay = ev => { const b = ev.target.closest && ev.target.closest('[data-eday]'); const r = $('#dread'); if(b && r) r.textContent = `${fmtD(b.dataset.eday)} · ${money(b.dataset.v)}`; };
document.addEventListener('mouseover', showDay);
document.addEventListener('focusin', showDay);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(RENDER[h] && h!==ui.view) go(h); });

/* ---------- live reminders while the page is open ---------- */
const alerted = new Set();
function tick(){
  const now = Date.now();
  for(const r of byKind('reminder')){
    if(r.done || alerted.has(r.id+r.at)) continue;
    const ms = atMs(r.at);
    if(ms <= now && now - ms < 15*60000){ alerted.add(r.id+r.at); toast(`Reminder: ${r.title}`, {label:'Done', fn:()=>toggle(r.id)}); break; }
  }
  renderSide();
}
setInterval(tick, 30000);

/* ---------- boot ---------- */
function setCapture(){
  const sel = $('#cap-kind'), hint = $('#cap-hint');
  if(!sample){
    const o = sel.querySelector('option[value="auto"]'); if(o) o.remove();
    if(sel.value==='auto' || !sel.value) sel.value = 'task';
    const vb = $('#cap-voice'); if(vb) vb.hidden = true;
    const pb = $('#cap-pic'); if(pb) pb.hidden = true;
    hint.textContent = 'Choose a type on the right before adding.';
  }
  render();
}
async function boot(){
  try { ui.navMore = localStorage.getItem('hy-navmore') === '1'; ui.pushHide = localStorage.getItem('hy-push-hide') === '1'; } catch(e){}
  pushInit();
  // Pintasan ikon (tekan lama ikon Hey Armay): ?go=speak | write | expense
  try {
    const goTo = new URLSearchParams(location.search).get('go');
    if(goTo){
      history.replaceState(null, '', location.pathname + (goTo === 'expense' ? '#belanja' : '#hari-ini'));
      setTimeout(() => {
        if(goTo === 'speak'){ const v = $('#cap-voice'); if(v && !v.hidden) v.click(); else { document.body.classList.add('hy-cap'); const i = $('#cap-in'); if(i) i.focus(); } }
        else if(goTo === 'write'){ document.body.classList.add('hy-cap'); const i = $('#cap-in'); if(i) i.focus(); }
        else if(goTo === 'expense'){ go('belanja'); setTimeout(() => { const a = $('#ex-amt'); if(a) a.focus(); }, 300); }
      }, 600);
    }
  } catch(e){}
  if(window.__standalone){ loadTeam(); setInterval(() => loadTeam(true), 5*60000); loadEnv(); setInterval(() => loadEnv(), 15*60000); }
  try { const sc = localStorage.getItem('pd-scope'); if(sc==='bisnes' || sc==='peribadi') ui.exp.newScope = sc; lastMethod = localStorage.getItem('pd-method') || ''; } catch(e){}
  const h = location.hash.slice(1); if(RENDER[h]) ui.view = h;
  render();
  if(!window.claude || !window.claude.use){ mode = 'local'; setCapture(); return; }
  const [d, s, dl, as] = await Promise.all([claude.use('db'), claude.use('sample'), claude.use('downloads'), claude.use('assets')]);
  sample = s || null; downloads = dl || null; assets = as || null;
  if(sample){ try { const lim = await sample.limits(); canImg = !!(lim && lim.images); } catch(e){ canImg = false; } }
  setCapture();
  if(!d){ mode = 'local'; render(); return; }
  col = d.collection('items');
  expCol = d.collection('belanja');
  expCol.where('date', '>=', shiftMonth(ym(), -11) + '-01').onSnapshot(snap => {
    exps = snap.docs.map(x => ({id:x.id, ...x.data()}));
    if(editing && editing.kind==='expense' && !get(editing.id)) closeEditor();
    render();
  }, () => { toast("Expense data couldn't load. Reload the page."); });
  col.onSnapshot(snap => {
    items = snap.docs.map(x => ({id:x.id, ...x.data()}));
    mode = 'db';
    if(editing && !get(editing.id)) closeEditor();
    render(); tick();
  }, () => { mode = 'local'; render(); toast('Lost the connection to storage. Reload the page.'); });
}
boot();
})();
</script>
