name: Android widget app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk HeyArmayWidget.apk
          gh release delete widget-latest -y --cleanup-tag || true
          gh release create widget-latest HeyArmayWidget.apk -t "Hey Armay Widget (build ${{ github.run_number }})" -n "Android home-screen widget for Hey Armay."
      - uses: actions/upload-artifact@v4
        with:
          name: HeyArmayWidget
          path: HeyArmayWidget.apk
