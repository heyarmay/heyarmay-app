plugins { id 'com.android.application' }
def run = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
android {
  namespace 'com.heyarmay.app'
  compileSdk 34
  defaultConfig {
    applicationId 'com.heyarmay.app'
    minSdk 26
    targetSdk 34
    versionCode run
    versionName "1.0." + run
  }
  signingConfigs {
    fixed {
      storeFile file('widget.keystore')
      storePassword 'heyarmay'
      keyAlias 'heyarmay'
      keyPassword 'heyarmay'
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.fixed }
    debug { signingConfig signingConfigs.fixed }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
